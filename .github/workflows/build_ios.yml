name: Build iOS Package (IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App Bundle
        run: flutter build ios --release --no-codesign

      - name: Package into IPA Archive
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Al_Ijadah_Pickup_iOS.ipa Payload
        shell: bash

      - name: Upload iOS Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: al-ijadah-ios-ipa
          path: Al_Ijadah_Pickup_iOS.ipa
